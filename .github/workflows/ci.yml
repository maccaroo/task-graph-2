name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: src/api/**/*.trx

  ui:
    name: UI — build, lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/ui/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E — Playwright
    runs-on: ubuntu-latest
    needs: [api, ui]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/e2e/package-lock.json

      - name: Install Playwright deps
        working-directory: src/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: src/e2e
        run: npx playwright install --with-deps chromium

      - name: Start E2E stack
        run: docker compose -f infrastructure/docker-compose.e2e.yml up -d --build

      - name: Wait for UI to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3001 && echo "UI ready" && exit 0
            echo "Waiting... ($i)"
            sleep 5
          done
          echo "UI did not become ready in time" && exit 1

      - name: Run Playwright tests
        working-directory: src/e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost:3001
          API_URL: http://localhost:5001

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: src/e2e/playwright-report/

      - name: Tear down E2E stack
        if: always()
        run: docker compose -f infrastructure/docker-compose.e2e.yml down -v
