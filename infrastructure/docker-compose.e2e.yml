name: taskgraph-e2e

# Standalone compose file for E2E test runs.
# Uses an ephemeral (non-persistent) database so every run starts clean.

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: taskgraph
      POSTGRES_USER: taskgraph
      POSTGRES_PASSWORD: taskgraph
    ports:
      - "${E2E_DB_PORT:-5533}:5533"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskgraph"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../src/api
      dockerfile: TaskGraph.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=taskgraph;Username=taskgraph;Password=taskgraph"
      Jwt__SecretKey: "E2E_TEST_SECRET_KEY_AT_LEAST_32_CHARS!!"
      BCrypt__WorkFactor: "4"
    ports:
      - "${E2E_API_PORT:-5501}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10

  ui:
    build:
      context: ../src/ui
      dockerfile: Dockerfile
    ports:
      - "${E2E_UI_PORT:-3001}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/80'"]
      interval: 5s
      timeout: 5s
      retries: 10
